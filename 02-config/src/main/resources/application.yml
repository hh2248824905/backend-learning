# ============================================================
# 主配置文件：所有环境共享的通用配置
# 环境差异配置放在 application-{profile}.yml 中
# ============================================================

server:
  port: 8002

spring:
  application:
    name: 02-配置管理
  # 激活的环境（dev / prod），可通过命令行参数 --spring.profiles.active=prod 覆盖
  profiles:
    active: dev

# 基础自定义配置：@Value 直接注入
# 占位符来源：下方 app.author 通过 ${mxu.name} 引用
mxu:
  name: a1788
  job: 学习者

# ========== 案例 1: @ConfigurationProperties 类型安全绑定（嵌套对象 + List + Map + List 嵌套对象） ==========
student:
  name: 张三
  age: 18
  hobbies:
    - 篮球
    - 编程
    - 阅读

  # Map 绑定：key 随意写，value 类型由 Java Map 声明决定
  scores:
    chinese: 90
    math: 95
    english: 88

  # 嵌套对象绑定
  address:
    province: 江苏省
    city: 南京市

  # 对象列表绑定：列表每一项都是 name/credit 结构
  courses:
    - name: 高等数学
      credit: 4
    - name: 大学英语
      credit: 3

# ========== 案例 4: @ConfigurationProperties + @Validated 配置校验 ==========
app:
  name: 配置管理模块
  # 占位符：引用上方 mxu.name 的值
  author: ${mxu.name}
  port: 8002
  max-count: 100

  # ---- 旧代码兼容块 ----
  # com.itheima.UserController 的 @Value("${app.user.*}") 依赖，
  # 删掉旧代码后此块可整段移除（AppProperties 会忽略未知 key，不影响绑定）
  user:
    name: a1788
    job: 学习者
