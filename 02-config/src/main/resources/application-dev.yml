# ============================================================
# 开发环境配置：spring.profiles.active=dev 时生效（主配置里已默认 dev）
# 只写环境差异项；同名 key 会覆盖主配置
# ============================================================
logging:
  level:
    # 开发期开自己包的 debug，方便看配置绑定和请求处理过程
    top.a1788.config: debug
    org.springframework.web: info

# 多环境差异配置：@Value("${env.name}") / @Value("${env.description}") 读取
env:
  name: 开发环境
  description: 用于开发调试，日志级别较低
